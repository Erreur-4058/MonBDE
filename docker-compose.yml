services:

  # ─── Serveur Web PHP (Apache) ────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: monbde_web
    restart: unless-stopped
    ports:
      - "8089:80"  # NPM peut accéder via IP du NAS
    volumes:
      - sqlite_data:/var/www/html/core/database
      - snack_db:/var/www/html/Snack/db
      - snack_uploads:/var/www/html/Snack/api/uploads
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - DISCORD_CHANNEL_COMMANDES=${DISCORD_CHANNEL_COMMANDES}
      - API_BOT_TOKEN=${API_BOT_TOKEN}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost}
      - SNACK_BASE_URL=${SNACK_BASE_URL:-http://localhost}
    networks:
      - monbde_net

  # ─── Bot Discord Node.js ──────────────────────────────────────────────────────
  bot:
    build:
      context: ./Snack/bot
      dockerfile: Dockerfile.bot
    container_name: monbde_bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - DISCORD_CHANNEL_COMMANDES=${DISCORD_CHANNEL_COMMANDES}
      - API_BASE_URL=${API_BASE_URL}
      - API_BOT_TOKEN=${API_BOT_TOKEN}
      - BOT_HTTP_PORT=${BOT_HTTP_PORT:-3001}
    ports:
      - "127.0.0.1:3001:3001"  # Interne uniquement
    networks:
      - monbde_net
    depends_on:
      - web

# ─── Volumes persistants (données SQLite) ────────────────────────────────────
volumes:
  sqlite_data:
  snack_db:
  snack_uploads:

# ─── Réseau interne ───────────────────────────────────────────────────────────
networks:
  monbde_net:
    driver: bridge
