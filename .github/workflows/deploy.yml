name: 🚀 Deploy MonBDE to Production

on:
  push:
    branches:
      - prod   # Se déclenche uniquement sur push vers prod

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      # ── 1. Récupérer le code ────────────────────────────────────────────────
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # ── 2. Se connecter au serveur via SSH et déployer ──────────────────────
      - name: 🔐 Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port:     ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            # ── Cloner si premier déploiement, sinon mettre à jour ────────────
            if [ ! -d ~/MonBDE_prod ]; then
              git clone https://github.com/Erreur-4058/MonBDE.git ~/MonBDE_prod
              cd ~/MonBDE_prod
              git checkout prod
            else
              cd ~/MonBDE_prod
              git fetch origin
              git checkout prod
              git pull origin prod
            fi

            # ── Générer le .env du bot depuis les secrets GitHub ──────────────
            cat > Snack/bot/.env <<EOF
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            DISCORD_GUILD_ID=${{ secrets.DISCORD_GUILD_ID }}
            DISCORD_CHANNEL_COMMANDES=${{ secrets.DISCORD_CHANNEL_COMMANDES }}
            API_BASE_URL=https://monbde.duckdns.org/Snack/api
            API_BOT_TOKEN=${{ secrets.API_BOT_TOKEN }}
            BOT_HTTP_PORT=${{ secrets.BOT_HTTP_PORT }}
            EOF

            # ── (Re)construire et redémarrer les conteneurs Docker ────────────
            docker compose down --remove-orphans
            docker compose build --no-cache
            docker compose up -d

            echo "✅ Déploiement terminé sur monbde.duckdns.org"
